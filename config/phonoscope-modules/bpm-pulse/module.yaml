engineVersion: 1
id: bpm-pulse-example
version: 1.0.0
name: BPM Pulse Example
description: Minimal beat-synchronised rings that also remain alive in ambient mode.
dimension: 2d
bounds: { min: [-1.7778, -1], max: [1.7778, 1] }
boundary: wrap
settings:
  - { id: intensity, label: Intensity, min: 0, max: 2, step: 0.05, default: 1 }
templates:
  ring:
    render:
      primitive: ring
      material: emissive
      color: "=mix(palette.primary, palette.highlight, beat.phase)"
      glow: "=0.2 + beat.pulse * settings.intensity"
    transform:
      scale: "=vec3(0.25 + beat.phase * 0.5, 0.25 + beat.phase * 0.5, 1)"
scene:
  - { id: pulse, template: ring }
resources: { maxParticles: 1024, maxInteractiveFieldEntities: 256, maxRenderBatches: 8 }
metadata: { author: Nova, license: Household use, tags: [reference, bpm] }
