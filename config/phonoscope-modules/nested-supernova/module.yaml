engineVersion: 1
id: nested-supernova
version: 1.0.0
name: Nested Supernova
description: A 3D beat burst with child motes, trails, and secondary shockwaves.
dimension: 3d
bounds: { min: [-2, -1.2, -2], max: [2, 1.2, 2] }
boundary: { mode: trigger, effect: edge-flash, then: respawn, restitution: 0.6 }
settings:
  - { id: density, label: Density, min: 0.2, max: 2, step: 0.05, default: 1 }
templates:
  mote:
    lifetime: "=1 + random.x * 2"
    render:
      primitive: sphere
      material: emissive
      color: "=mix(palette.primary, palette.highlight, lifetime)"
      glow: "=0.3 + audio.high * 0.7"
    physics: { mass: 0.6, drag: 0.03, inertia: 0.975, gravity: [0, -0.03, 0] }
    children:
      - render: { primitive: trail, material: emissive, blend: additive, glow: 0.6 }
    effectSources:
      - { id: death-wave, trigger: death, shape: sphere, kind: wave, propagation: radial, strength: 0.2, speed: 2, falloff: 0.8 }
  core:
    render: { primitive: icosphere, material: phong, color: "=palette.primary", glow: "=beat.pulse" }
    emitter:
      template: mote
      trigger: beat
      burst: "=24 * settings.density"
      maxParticles: 8192
      lifetime: [1, 3]
      velocity: { radial: [0.2, 1.1] }
scene:
  - { id: supernova, template: core }
resources: { maxParticles: 12288, maxInteractiveFieldEntities: 512, maxRenderBatches: 24 }
metadata: { author: Nova, license: Household use, tags: [reference, nested, 3d] }
