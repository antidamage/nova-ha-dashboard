engineVersion: 1
id: particle-ripples
version: 1.3.0
name: Particle Ripples
description: A centered screen-wide particle lattice carrying slow, damped beat ripples.
dimension: 2d
bounds: { min: [-1.777778, -1], max: [1.777778, 1] }
boundary: { mode: clamp, restitution: 0 }
settings:
  - id: intensity
    label: Ripple intensity
    description: Base energy carried by every beat wave.
    control: slider
    min: 0
    max: 2
    step: 0.05
    default: 1
    affects: [scene.particle-grid.effectSources.beat-ripple.strength]
  - id: strong_beat_multiplier
    label: Strong beat multiplier
    description: Extra wave energy applied only as bass strength enters its upper range.
    control: slider
    min: 1
    max: 3
    step: 0.05
    default: 1.65
    curve: { type: power, exponent: 1.6 }
    affects: [scene.particle-grid.effectSources.beat-ripple.strength]
  - id: peak_threshold
    label: Peak threshold
    description: Wave energy at which the HDR flare begins to bloom.
    control: slider
    min: 0.1
    max: 0.8
    step: 0.01
    default: 0.28
    curve: { type: power, exponent: 1.5 }
    affects: [templates.particle.render.flareThreshold]
  - id: peak_glow
    label: Peak glow
    description: Maximum HDR bloom energy at a fully activated crest.
    control: slider
    min: 1
    max: 12
    step: 0.25
    default: 6.5
    curve: { type: power, exponent: 2 }
    affects: [templates.particle.render.flareGlow]
  - id: anticipation
    label: Glow anticipation
    description: How early the leading edge starts to illuminate before the crest arrives.
    control: slider
    min: 0.12
    max: 0.9
    step: 0.01
    default: 0.5
    affects: [scene.particle-grid.effectSources.beat-ripple.anticipation]
  - id: ramp_up
    label: Flash ramp up
    description: Time taken for rising wave energy to reach the flash.
    control: slider
    min: 0.015
    max: 0.2
    step: 0.005
    default: 0.04
    curve: { type: power, exponent: 2.2 }
    affects: [scene.particle-grid.effectSources.beat-ripple.attack]
  - id: release
    label: Glow release
    description: Time for the crest glow to ease back into the dot.
    control: slider
    min: 0.15
    max: 1.5
    step: 0.05
    default: 0.7
    curve: { type: power, exponent: 1.6 }
    affects: [scene.particle-grid.effectSources.beat-ripple.release]
  - id: flash_power
    label: Flash power
    description: Shapes how sharply the leading-edge glow concentrates into its crest.
    control: slider
    min: 1.5
    max: 8
    step: 0.1
    default: 3.8
    curve: { type: power, exponent: 1.5 }
    affects: [scene.particle-grid.effectSources.beat-ripple.flashPower]
templates:
  particle:
    render:
      primitive: point
      material: emissive
      color: "=mix(palette.primary, palette.highlight, clamp(field.energy, 0, 1))"
      glow: 1.25
      energySize: 0
      beatSize: 0
      flareThreshold: "=settings.peak_threshold"
      flareSize: 0
      flareGlow: "=settings.peak_glow"
    transform:
      scale: [0.0035, 0.0035, 1]
    physics: { mass: 1.2, inertia: 0.92, drag: 0.18 }
    effectReceivers:
      - { accepts: [wave], operation: add, target: field.energy, scale: 1 }
scene:
  - id: particle-grid
    field:
      layout: grid
      resolution: [113, 22]
      count: 2486
      template: particle
      spacing: [0.031746, 0.031746]
      jitter: 0
      topology: grid
      channels: { energy: 0 }
    effectSources:
      - id: beat-ripple
        trigger: beat
        shape: circle
        kind: wave
        propagation: radial
        strength: "=settings.intensity * (0.45 + audio.bass * 0.55) * mix(1, settings.strong_beat_multiplier, smoothstep(0.55, 1, audio.bass))"
        speed: 0.36
        falloff: 0.965
        waveform: gerstner
        wavelength: 0.095238
        steepness: 0.9
        anticipation: "=settings.anticipation"
        attack: "=settings.ramp_up"
        release: "=settings.release"
        flashPower: "=settings.flash_power"
        duration: 6
        channel: energy
resources: { maxParticles: 4096, maxInteractiveFieldEntities: 4096, maxRenderBatches: 4 }
metadata: { author: Nova, license: Household use, tags: [particle, field, ripple, 2d] }
