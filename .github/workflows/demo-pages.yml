name: Deploy Demo GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build:demo
        env:
          NEXT_PUBLIC_NOVA_DEMO_PROVIDER_BASE: ${{ vars.NOVA_DEMO_PROVIDER_BASE || 'https://antidamage.github.io/nova-dummy-data-provider/' }}
          NEXT_PUBLIC_NOVA_DEMO_BASE_PATH: ${{ vars.NOVA_DEMO_BASE_PATH || '/nova-ha-dashboard' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
