# systemd drop-in for the distro-packaged caddy.service on Nocturnium.
# Installs to /etc/systemd/system/caddy.service.d/override.conf.
#
# Points caddy at ops/nocturnium-caddy.Caddyfile instead of the package
# default, and loads NOVA_CAMERA_PROXY_TOKEN from /etc/nova-camera-proxy.env
# so the Caddyfile's {$NOVA_CAMERA_PROXY_TOKEN} substitution resolves. That
# env file is optional (the "-" prefix) so a missing file logs a warning
# rather than refusing to start — matching nocturnium-camera-proxy.service's
# own EnvironmentFile pattern.
[Service]
EnvironmentFile=-/etc/nova-camera-proxy.env
ExecStart=
ExecStart=/usr/bin/caddy run --environ --config /etc/caddy/nocturnium-caddy.Caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/caddy/nocturnium-caddy.Caddyfile --force
